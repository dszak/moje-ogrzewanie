/* Gas intervals: wide tables stay legible, phone layout uses cards instead. */
.gas-table{min-width:820px;table-layout:fixed}
.gas-table th,.gas-table td{white-space:nowrap;overflow-wrap:normal;word-break:normal}
.gas-mobile{display:none}
@media(max-width:640px){
  .gas-table-wrap{display:none}
  .gas-mobile{display:grid;gap:11px}
  .gas-record{padding:15px;border:1px solid var(--line);background:#f9fcf9;border-radius:13px}
  .gas-record-header{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
  .gas-record-header strong{font-size:15px}
  .gas-record-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
  .gas-record-grid>div{min-width:0}
  .gas-record-grid span{font-size:13px;color:var(--ink2);display:block}
  .gas-record-grid b{font-size:16px;display:block;overflow-wrap:normal;word-break:normal}
}

/* Gas reading history: keep the desktop table, use legible cards on narrow screens. */
.gas-history-table{min-width:980px;table-layout:fixed}
.gas-history-table th,.gas-history-table td{white-space:nowrap;overflow-wrap:normal;word-break:normal}
.gas-history-table td:last-child{white-space:normal}
.gas-history-mobile{display:none}
@media(max-width:640px){
 .gas-history-table-wrap{display:none}
 .gas-history-mobile{display:grid;gap:12px}
 .gas-history-entry{min-width:0;padding:16px;border:1px solid var(--line);border-radius:14px;background:#f9fcf9}
 .gas-history-entry-header{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}
 .gas-history-entry-header strong{font-size:15px;white-space:nowrap}
 .gas-history-entry-value{font-size:27px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;white-space:nowrap;margin:11px 0 2px}
 .gas-history-entry-value span{font-size:15px;font-weight:650;color:var(--ink2)}
 .gas-history-entry-source{font-size:14px;color:var(--ink2);margin-bottom:12px}
 .gas-history-entry-setti{border-top:1px solid var(--line);padding-top:5px}
 .gas-history-entry-setti summary{cursor:pointer;font-size:15px;font-weight:700;padding:8px 0;min-height:44px}
 .gas-history-entry-setti summary:focus-visible{outline:3px solid #a4d8cb;outline-offset:2px}
 .gas-history-entry-sync{font-size:14px;color:var(--ink2);line-height:1.5;padding:1px 0 13px}
 .gas-history-entry-rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 8px}
 .gas-history-entry-room{min-width:0;overflow-wrap:normal;word-break:normal}
 .gas-history-entry-room span{display:block;font-size:14px;color:var(--ink2)}
 .gas-history-entry-room strong{display:block;font-size:15px;font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
 .gas-history-entry-room small{font-size:14px;font-weight:550;color:var(--ink2)}
 .gas-history-entry-empty{border-top:1px solid var(--line);padding-top:12px;font-size:14px;color:var(--ink2)}
}
@media(max-width:350px){.gas-history-entry-rooms{grid-template-columns:1fr}}

/* Read-only TRV001 readings, mobile-first. */
.head-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.head-reading{min-width:0;border:1px solid var(--line);border-radius:14px;background:#f9fcf9;padding:16px}
.head-reading-head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.head-reading-values{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:13px 0}
.head-reading-values strong{display:block;font-size:24px;font-weight:800;line-height:1.2;white-space:nowrap;font-variant-numeric:tabular-nums}
.head-reading-values span{display:block;font-size:14px;color:var(--ink2);margin-top:5px}
.head-reading-extra{border-top:1px solid var(--line);padding-top:11px;font-size:14px;color:var(--ink2)}
@media(max-width:560px){.head-grid{grid-template-columns:1fr}}

/* v1.4: comfortable mobile reading and a compact read-only heating overview */
.panel-readings{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin:13px 0}
.panel-readings>div{background:#f6faf7;border:1px solid var(--line);border-radius:12px;padding:13px;min-width:0}
.panel-readings span{display:block;color:var(--ink2);font-size:14px;line-height:1.4}
.panel-readings strong{display:block;font-size:24px;font-weight:780;line-height:1.3;margin-top:5px;font-variant-numeric:tabular-nums}
.panel-heads{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:13px}
.panel-head{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;min-width:0}
.panel-head b{font-size:16px}.panel-head span{color:var(--ink2);font-size:15px}.panel-head span strong{color:var(--ink)}.panel-head small{font-size:14px;color:var(--ink2);line-height:1.5}
.gas-actions{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.gas-actions .action{min-height:44px;padding:8px 13px;font-size:14px}
.gas-edit{border:2px solid #9bcabd}
.gas-edit h3{font-size:20px}
@media(max-width:560px){.panel-readings{grid-template-columns:repeat(2,minmax(0,1fr))}.panel-heads{grid-template-columns:1fr}.panel-readings strong{font-size:23px}}
/* v1.5: legible, private ENGO cycle import and activity cards */
.engo-example{background:var(--base);border:1px solid var(--line);border-radius:10px;padding:12px;white-space:pre-wrap;font:14px/1.5 ui-monospace,SFMono-Regular,monospace}
.engo-preview{border:2px solid #99c7bc}
.engo-event-list{max-height:300px;overflow:auto;padding-left:25px}
.engo-event-list li{padding:4px 0;font-variant-numeric:tabular-nums}
.engo-days{display:grid;gap:8px;margin-top:12px}
.engo-day,.engo-history-item{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.engo-day span{color:var(--ink2);font-size:14px}
.engo-history-item{min-height:64px}
.engo-history-item b{font-variant-numeric:tabular-nums}
@media(max-width:560px){.engo-day,.engo-history-item{align-items:flex-start;flex-direction:column}.engo-history-item .gas-actions{margin:0}}
/* v1.6: private Home Assistant history chart, usable on narrow phones */
.temp-chart-wrap{overflow-x:auto;max-width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:8px 6px;-webkit-overflow-scrolling:touch}
.temp-chart{display:block;width:100%;min-width:720px;height:auto}
.temp-legend{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}
.temp-legend .action{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:9px 12px;font-size:14px}
.temp-room{opacity:.58}
.temp-room.selected{opacity:1;border-color:#9ebbb0;background:#f2faf6}
.temp-dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.temp-preview{border:2px solid #96c8b8}
.temp-import-breakdown{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.temp-import-breakdown span{font-size:14px;color:var(--ink2)}
.temp-summary{min-width:510px}
.temp-summary th,.temp-summary td{white-space:nowrap}
@media(max-width:560px){.temp-import-breakdown{grid-template-columns:1fr}.temp-chart-wrap{margin:0 -4px}}
/* v1.7: readable evidence report and a local decision log */
.review-summary{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.65 ui-monospace,SFMono-Regular,monospace;background:#f7fbf8;border:1px solid var(--line);padding:12px;border-radius:12px;max-height:310px;overflow:auto}
.review-rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.review-room{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#f9fcf9;display:flex;flex-direction:column;gap:3px}
.review-room span{color:var(--ink2);font-size:13px}
.review-entry{padding:16px 0;border-top:1px solid var(--line)}
.review-entry:first-of-type{border-top:0}
.review-entry p{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}
@media(max-width:560px){.review-rooms{grid-template-columns:1fr}.review-summary{max-height:240px}.review-entry .group-heading{align-items:flex-start;flex-direction:column}}
/* v1.8: private project memory and evidence registry, narrow-screen safe */
.memory-card{margin-top:12px}
.memory-card textarea{resize:vertical}
.review-entry p{overflow-wrap:anywhere}
@media(max-width:560px){.memory-card .actions{flex-direction:column}.memory-card .actions button{width:100%}}
/* v1.8.1: governing principle and virtues, readable on narrow iPhone screens */
.moral-principles{margin:16px 0}
.moral-motto{font-weight:750;font-size:clamp(19px,4.8vw,26px);line-height:1.3;letter-spacing:-.015em;margin:12px 0}
.moral-purpose{font-size:16px;line-height:1.6;max-width:72ch}
.virtues-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.virtue{background:#f9fcf9;border:1px solid var(--line);border-radius:12px;padding:13px;min-width:0}
.virtue h4{margin:0 0 8px}
.virtue p{line-height:1.55;margin:6px 0;overflow-wrap:anywhere}
.moral-home{margin:14px 0 18px;padding:15px}
.moral-home-label{font-size:13px;font-weight:650;color:var(--ink2);margin:0 0 4px}
.moral-home strong{font-size:19px;line-height:1.3;display:block}
.moral-home p{line-height:1.5}
@media(max-width:620px){.virtues-grid{grid-template-columns:1fr}.moral-principles{padding:14px}.moral-motto{font-size:21px}}
</style>
